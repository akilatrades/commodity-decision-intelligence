name: Petchem mass balance and hedge scenarios
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  petchem:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r projects/petchem-feedstock/requirements.txt
      - working-directory: projects/petchem-feedstock
        run: |
          pytest test_model.py
          python run_analysis.py
