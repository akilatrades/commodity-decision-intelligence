name: Physical crude book reconciliation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  physical-book:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r projects/physical-crude-book/requirements.txt
      - working-directory: projects/physical-crude-book
        run: |
          pytest test_book.py
          python build_book.py
          python book.py
